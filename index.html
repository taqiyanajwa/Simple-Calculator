<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>function</title>
  </head>
  <body>
    <button type = "button" onclick="sayHello()">Click</button>
    <form>
      <label>Fahrenheit</label><br>
      <input type="number" id="f" placeholder="enter the temperature"><br>
      <button type="button" onclick="toCelicius()">Konversi</button><br>
      <label>Celcius</label>
      <h1 id="suhuKonversi">0</h1>
    </form>
      <label>Number 1</label><br>
      <input type="number" id="num1" placeholder="Enter the Number"><br>
      <label>Number 2</label><br>
      <input type="number" id="num2" placeholder="Enter the Number"></br>
      <button type="button" onclick="tambah()">+</button>
      <button type="button" onclick="kurang()">-</button>
      <button type="button" onclick="kali()">x</button>
      <button type="button" onclick="bagi()">:</button><br>
      <label>Result</label>
      <h1 id="hasil">0</h1>
    </form>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
  <script>
    function sayHello(){
      return alert("Hello world");
    }

    function toCelicius(){
      let suhuFahrenheit = document.getElementById("f").value;
      let konversi = (5/9) * (suhuFahrenheit-32);
      return document.getElementById("suhuKonversi").innerHTML= konversi.toFixed(2);
    }

    function tambah(){
            let num1 = document.getElementById("num1").value;
            let num2 = document.getElementById("num2").value;
            let kalkulasi = parseFloat(num1) + parseFloat(num2);
            return document.getElementById("hasil").innerHTML= kalkulasi;
        }

        function kurang(){
            let num1 = document.getElementById("num1").value;
            let num2 = document.getElementById("num2").value;
            let kalkulasi = parseFloat(num1) - parseFloat(num2);
            return document.getElementById("hasil").innerHTML= kalkulasi;
        }

        function kali(){
            let num1 = document.getElementById("num1").value;
            let num2 = document.getElementById("num2").value;
            let kalkulasi = parseFloat(num1) * parseFloat(num2);
            return document.getElementById("hasil").innerHTML= kalkulasi;
        }

        function bagi(){
            let num1 = document.getElementById("num1").value;
            let num2 = document.getElementById("num2").value;
            let kalkulasi = parseFloat(num1) / parseFloat(num2);
            return document.getElementById("hasil").innerHTML= kalkulasi;
        }

  </script>
</html>
